name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      trigger:
        description: "Label recorded in latest.json (watch-site.yml sends 'deploy')"
        required: false
        default: manual
  # Can also be sent by another repository after a deploy
  repository_dispatch:
    types: [site-deployed]
  schedule:
    - cron: "0 8 * * 1"

# Two runs must not push to gh-pages at the same time. Queue them instead
# of cancelling: every run belongs in the published history.
concurrency:
  group: release-guard
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Validate target URL secret
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "BASE_URL secret is required to run the release guard in CI."
            exit 1
          fi
      # Fingerprint of the page under test, read before the run so a deploy
      # landing mid-run is caught by the next watch.
      - name: Record the tested site version
        run: |
          version=$(curl -sfI "$BASE_URL" | tr -d '\r' | awk 'tolower($1)=="etag:" {print $2}' | tr -d '"')
          echo "SITE_VERSION=${version}" >> "$GITHUB_ENV"
      - name: Run Playwright tests
        run: npm test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && vars.UPLOAD_ARTIFACTS == 'true' }}
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 5

      # Publish the HTML report, latest.json, history.json and the health
      # page to GitHub Pages, green or red. Pull requests are not published.
      # gh-pages is rebuilt as a single commit each time so traces do not pile
      # up in git; history.json carries the track record forward.
      - name: Publish report and run summary
        if: ${{ !cancelled() && github.event_name != 'pull_request' && hashFiles('results/results.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_TRIGGER: ${{ inputs.trigger == 'deploy' && 'deploy' || '' }}
        run: |
          set -euo pipefail
          mkdir pages-site
          cd pages-site
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git show FETCH_HEAD:history.json > history.json 2>/dev/null || rm -f history.json
          fi
          git checkout -q --orphan gh-pages
          cp -r ../playwright-report report
          cp ../pages/index.html index.html
          touch .nojekyll
          node ../scripts/summarize-run.mjs ../results/results.json .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish run ${GITHUB_RUN_ID}"
          git push -q -f origin HEAD:gh-pages
